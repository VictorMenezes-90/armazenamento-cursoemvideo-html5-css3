<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pseudoclasses</title>
        <style>
            div{           
                background-color: rgb(200,0,0);
                border: 1px solid rgb(0,0,0);

                color: rgb(255,255,255);
                text-align: center;

                height: 150px;
                width: 150px;
            }

            div:hover{
                background-color: rgb(255,0,0);
                color: rgb(255,255,255);
            }

            div#Escondido > p{
                display: none;
            }

            div#Escondido:hover > p{
                display: block;

                background-color: rgb(0, 0, 0);
                color: rgb(255,255,255);
            }
        </style>
    </head>
    <body>
        <div id="d1">01</div>
        <div id="d2">02</div>
        <div id="d3">03</div>
        <div id="Escondido">Passe o mouse para revelar o texto...<p>Texto escondido >:]</p>
        </div>
    </body>
</html>
