<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Caixas Box-Level</title>
        <style>

            h1{
                background-color: rgb(200,200,200);

                height: auto;
                width: fit-content;

                border: solid rgb(0,0,0);
                border-width: 2.25px 7px 2.25px 7px;
                border-radius: 50px 0px 50px 0px;
                padding: 5px 25px 5px 25px;

                margin: 10px auto 10px auto;
                outline: 3px dotted rgb(255,0,0);
            }
        </style>
    </head>
    <body>
        <h1>Exemplo de caixa box-level</h1>
        <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona na prática.</p>
    </body>
</html>
